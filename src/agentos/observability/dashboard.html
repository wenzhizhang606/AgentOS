<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>运行监控 · AgentOS</title>
  <style>
    :root { color-scheme:light; --ink:#182d2a; --muted:#506660; --line:#d1ded9; --green:#075a48; --warn:#9a481f }
    * { box-sizing:border-box }
    body { margin:0; font:15px/1.5 "Inter","Microsoft YaHei",system-ui,sans-serif; color:var(--ink); background:#f3f7f5 }
    header { background:#133e35; color:white; padding:19px max(5vw,calc((100vw - 1180px)/2)) }
    header strong { font-size:19px; letter-spacing:.02em }
    main { max-width:1220px; margin:auto; padding:30px 24px 60px }
    h1 { margin:0 0 18px; font-size:clamp(27px,4vw,38px); line-height:1.2 }
    h2 { margin:0; font-size:20px }
    section { margin-top:24px; padding:20px; border:1px solid var(--line); background:white; border-radius:10px }
    form,.actions { display:flex; align-items:end; flex-wrap:wrap; gap:12px }
    label { display:grid; gap:4px; font-weight:600 }
    input,button,select { font:inherit }
    input:not([type=checkbox]) { border:1px solid #829b91; border-radius:5px; padding:8px 10px; width:100%; min-width:0 }
    button { cursor:pointer; border-radius:5px; padding:8px 14px; border:1px solid #829b91; background:white; color:var(--ink) }
    button.primary { color:white; background:var(--green); border-color:var(--green) }
    button:disabled { opacity:.5; cursor:default }
    :focus-visible { outline:3px solid #317bc9; outline-offset:2px }
    [hidden] { display:none!important }
    .actions { align-items:center; margin-top:14px }
    .actions label { display:flex; align-items:center; font-weight:normal }
    select { border:1px solid #829b91; background:white; border-radius:5px; padding:7px }
    .note { color:var(--muted); margin:6px 0 }
    #status { margin:12px 0 0 }
    .warning { color:var(--warn); font-weight:650 }
    dl { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin:16px 0 0 }
    dl div { background:#f8fbfa; padding:12px }
    dt { color:var(--muted); font-size:14px }
    dd { margin:4px 0 0; font-size:20px; font-weight:650; overflow-wrap:anywhere; font-variant-numeric:tabular-nums }
    .scroll { overflow-x:auto; margin-top:10px }
    table { border-collapse:collapse; width:100%; text-align:left; font-size:14px }
    th,td { padding:10px 9px; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap; font-variant-numeric:tabular-nums }
    th { font-weight:600; color:var(--muted); background:#f8fbfa }
    .task-link { border:0; padding:0; color:var(--green); text-decoration:underline; font-family:ui-monospace,monospace }
    .selected { background:#eaf6f1 }
    .meta { overflow-wrap:anywhere; color:var(--muted) }
    .details { min-width:150px; max-width:360px; white-space:normal; overflow-wrap:anywhere }
    .details small { display:block; color:var(--muted) }
    nav { display:flex; gap:5px; margin-top:20px; border-bottom:1px solid var(--line) }
    nav button { padding:8px 14px; border:0; border-bottom:3px solid transparent; border-radius:0; background:none }
    nav button[aria-pressed=true] { color:var(--green); border-bottom-color:var(--green); font-weight:700 }
    .picker { display:flex; align-items:end; flex-wrap:wrap; gap:12px; margin-top:14px }
    .picker label { min-width:0; flex:1 }
    .picker select { width:100% }
    .paging { display:flex; flex-wrap:wrap; gap:6px }
    .run-button { color:var(--green); white-space:nowrap }
    #trace-id code { user-select:all; color:var(--ink) }
    #trace td:first-child { border-left:3px solid var(--line) }
    #trace tr.failed td:first-child { border-color:var(--warn) }
    @media(max-width:620px) { main { padding:20px 12px } section { padding:14px } form>label { width:100% } }
  </style>
</head>
<body>
<header><strong>AgentOS</strong></header>
<main>
  <h1>运行监控</h1>
  <form id="connect" autocomplete="off">
    <label>项目 ID<input id="project" type="text" required maxlength="128" spellcheck="false"></label>
    <label>访问令牌<input id="token" type="password" required autocomplete="off" spellcheck="false"></label>
    <button class="primary" type="submit">载入项目</button>
  </form>
  <div id="actions" class="actions" hidden>
    <label>时间范围<select id="hours"><option value="1">过去 1 小时</option><option value="24" selected>过去 24 小时</option><option value="168">过去 7 天</option></select></label>
    <button type="button" id="refresh">刷新</button>
    <label><input type="checkbox" id="automatic">每 30 秒刷新</label>
    <button type="button" id="disconnect">断开连接</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <nav aria-label="监控视图" id="views" hidden>
    <button type="button" id="overview-view" aria-pressed="true" aria-controls="report">项目概览</button>
    <button type="button" id="runs-view" aria-pressed="false" aria-controls="explorer">Agent 运行轨迹</button>
  </nav>
  <div id="report" hidden>
    <section aria-labelledby="summary-heading">
      <h2 id="summary-heading">项目概览</h2>
      <p id="scope" class="note"></p><p id="window" class="note"></p>
      <dl id="metrics"></dl>
    </section>
    <section aria-labelledby="registered-heading">
      <h2 id="registered-heading">当前发布的 Skill 和 Tool</h2>
      <p class="meta" id="release"></p>
      <div class="scroll">
        <table><thead><tr><th>类型</th><th>名称</th><th>版本</th><th>内容摘要</th></tr></thead>
          <tbody id="registered"></tbody></table>
      </div>
    </section>
    <section aria-labelledby="cap-heading">
      <h2 id="cap-heading">能力执行记录</h2><p class="note" id="cap-status"></p>
      <div class="scroll">
        <table><thead><tr><th>类型</th><th>能力 / 版本</th><th>记录数</th><th>成功</th><th>失败</th><th>无结束记录</th><th>平均耗时</th><th>P95 耗时</th><th>最大耗时</th></tr></thead>
          <tbody id="capabilities"></tbody></table>
      </div>
    </section>
    <section aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">最近任务</h2><p id="task-count" class="note"></p>
      <div class="scroll">
        <table><thead><tr><th>创建时间</th><th>任务 ID</th><th>状态</th><th>费用结算</th><th>错误码</th></tr></thead>
          <tbody id="tasks"></tbody></table>
      </div>
    </section>
    <section id="detail" aria-labelledby="detail-heading" hidden>
      <h2 id="detail-heading" tabindex="-1">任务时间线</h2><p id="detail-meta" class="meta"></p>
      <p id="detail-status" role="status"></p>
      <div class="scroll">
        <table><thead><tr><th>发生时间</th><th>类型</th><th>事件</th><th>尝试</th><th>来源 / 调用标识</th><th>耗时</th><th>错误码</th></tr></thead>
          <tbody id="timeline"></tbody></table>
      </div>
    </section>
  </div>
  <div id="explorer" hidden>
    <section aria-labelledby="agent-heading">
      <h2 id="agent-heading">选择 Agent</h2>
      <p id="agent-scope" class="note"></p>
      <div class="picker">
        <label>Agent 发布版本<select id="agent-version" disabled><option value="">选择发布版本</option></select></label>
        <div class="paging" aria-label="发布版本分页">
          <button type="button" id="agents-prev" disabled>上一页版本</button>
          <button type="button" id="agents-next" disabled>下一页版本</button>
        </div>
      </div>
      <p class="note" id="agent-note" role="status"></p>
      <form id="find-run" class="picker" autocomplete="off">
        <label>运行 ID<input id="run-id" required spellcheck="false" aria-describedby="run-id-hint" placeholder="任务 ID:尝试次数"></label>
        <button type="submit">按 ID 查看轨迹</button>
      </form>
      <p id="run-id-hint" class="note">输入完整运行 ID 可查看时间范围以外的记录。</p>
    </section>
    <section id="run-list" aria-labelledby="runs-heading" hidden>
      <h2 id="runs-heading">运行实例</h2>
      <p class="meta" id="runs-release"></p>
      <div class="scroll"><table>
        <thead><tr><th>开始时间</th><th>任务 ID</th><th>执行尝试</th><th>状态</th><th>Worker</th></tr></thead>
        <tbody id="instances"></tbody>
      </table></div>
      <div class="actions paging" aria-label="运行实例分页">
        <button type="button" id="instances-prev" disabled>上一页实例</button>
        <button type="button" id="instances-next" disabled>下一页实例</button>
      </div>
    </section>
    <section id="run-detail" aria-labelledby="trace-heading" hidden>
      <h2 id="trace-heading" tabindex="-1">本次运行轨迹</h2>
      <p id="trace-id" class="meta"></p>
      <dl id="run-facts"></dl>
      <p id="trace-note" class="note" role="status"></p>
      <div class="scroll"><table>
        <thead><tr><th>发生时间</th><th>类型</th><th>事件</th><th>执行尝试</th><th>来源 / 调用标识</th><th>耗时</th><th>错误码</th></tr></thead>
        <tbody id="trace"></tbody>
      </table></div>
      <div class="actions paging" aria-label="运行事件分页">
        <button type="button" id="events-next" disabled>更早事件</button>
        <button type="button" id="events-prev" disabled>较新事件</button>
      </div>
    </section>
  </div>
</main>
<script>
"use strict";
(() => {
  const byId = id => document.getElementById(id);
  const stateNames = {queued:"排队中", running:"运行中", succeeded:"成功", failed:"失败", cancelled:"已取消", timed_out:"已超时", superseded:"已被后续尝试接替"};
  const accounting = {pending:"待结算", final:"已结算", no_dispatch:"无模型准入"};
  const eventNames = {queued:"进入队列", claimed:"领取任务", started:"开始", succeeded:"完成", failed:"失败",
    timed_out:"超时", cancelled:"取消", dispatch_admitted:"模型发送准入", receipt_settled:"费用结算"};
  const kinds = {task:"任务", context:"上下文", skill:"Skill", tool:"Tool", model:"模型"};
  let connection = null, selected = null, projectRead = null, taskRead = null, timer = null;
  let view = "overview", agent = "", instance = null;
  function pageState() { return {previous:[], cursor:null, next:null}; }
  let agentPage = pageState(), runPage = pageState(), tracePage = pageState();
  const date = value => value ? new Date(value).toLocaleString("zh-CN", {hour12:false}) : "—";
  const eventTime = value => value ? date(value) + (value.match(/\.\d+(?=Z$)/)?.[0] ?? "") : "—";
  function elapsedMs(start, end) {
    if (!start || !end) return null;
    // Date.parse retains milliseconds. The DB also records the next three fractional digits.
    const subMillis = value => Number((value.split(".")[1] || "").replace(/Z$/, "").padEnd(6, "0").slice(3, 6));
    return (1000 * (Date.parse(end) - Date.parse(start)) + subMillis(end) - subMillis(start)) / 1000;
  }
  const ms = value => value == null ? "—" : value + " ms";
  function money(micros) {
    const digits = String(micros ?? "");
    if (!/^\d+$/.test(digits)) return "—";
    const padded = digits.padStart(7, "0");
    return "¥" + padded.slice(0, -6) + "." + padded.slice(-6);
  }
  function el(tag, value) {
    const node = document.createElement(tag);
    node.textContent = value == null ? "—" : String(value);
    return node;
  }
  function cell(row, value, css) {
    const td = el("td", value);
    if (css) td.className = css;
    row.append(td);
    return td;
  }
  function empty(tbody, count, message) {
    const row = el("tr", "");
    cell(row, message, "note").colSpan = count;
    tbody.append(row);
  }
  function schedule() {
    clearTimeout(timer);
    if (connection && byId("automatic").checked && !document.hidden) {
      timer = setTimeout(refresh, 30000);
    }
  }
  function clearDetail() {
    taskRead?.abort(); taskRead = null; selected = null;
    byId("detail").hidden = true;
    for (const id of ["timeline","detail-meta","detail-status"]) byId(id).replaceChildren();
  }
  function clearProject() {
    clearDetail();
    resetExplorer();
    byId("report").hidden = true;
    for (const id of ["metrics","capabilities","tasks","scope","window","task-count","registered","release","cap-status"]) byId(id).replaceChildren();
  }
  function disconnect() {
    clearTimeout(timer);
    projectRead?.abort(); projectRead = null; connection = null;
    clearProject();
    view = "overview";
    byId("views").hidden = true;
    setViewButtons();
    byId("connect").hidden = false;
    byId("actions").hidden = true;
    byId("automatic").checked = false;
    byId("token").value = "";
    byId("status").textContent = "";
  }
  function setViewButtons() {
    byId("overview-view").setAttribute("aria-pressed", String(view === "overview"));
    byId("runs-view").setAttribute("aria-pressed", String(view === "runs"));
  }
  function clearTrace() {
    byId("run-detail").hidden = true;
    for (const id of ["trace-id","run-facts","trace","trace-note"]) byId(id).replaceChildren();
  }
  function chooseRun(run) {
    instance = run;
    tracePage = pageState();
    for (const row of byId("instances").rows) row.classList.toggle("selected", row.dataset.run === run?.run_id);
    clearTrace();
  }
  function clearRuns() {
    byId("run-list").hidden = true;
    byId("instances").replaceChildren();
    byId("runs-release").replaceChildren();
    clearTrace();
  }
  function resetExplorer() {
    agentPage = pageState(); runPage = pageState(); tracePage = pageState(); agent = ""; instance = null;
    byId("run-id").value = "";
    byId("agent-version").replaceChildren();
    byId("agent-version").disabled = true;
    for (const id of ["agent-scope","agent-note"]) byId(id).replaceChildren();
    for (const id of ["agents-prev","agents-next","instances-prev","instances-next","events-prev","events-next"]) byId(id).disabled = true;
    byId("explorer").hidden = true;
    clearRuns();
  }
  async function read(path, signal) {
    const response = await fetch(path, {method:"GET", cache:"no-store", redirect:"error",
      credentials:"omit", mode:"same-origin", referrerPolicy:"no-referrer", signal,
      headers:{"Accept":"application/json","Authorization":"Bearer " + connection.token}});
    if (!response.ok) {
      const error = new Error("读取失败（HTTP " + response.status + "）");
      error.status = response.status;
      throw error;
    }
    return response.json();
  }
  function renderSummary(data) {
    const s = data.summary;
    byId("scope").textContent = "项目 " + data.project_id + " · " +
      (data.scope === "project" ? "全项目可见任务" : "当前主体可见任务");
    byId("window").textContent = "任务创建时间 " + date(data.window_start) + " 至 " + date(data.window_end) +
      "（本地时间） · 状态、费用取本次读取值";
    const metrics = byId("metrics");
    metrics.replaceChildren();
    for (const [name, value] of [
      ["任务数",s.tasks],["排队 / 运行",[s.queued,s.running].join(" / ")],["成功 / 失败",[s.succeeded,s.failed].join(" / ")],
      ["取消 / 超时",[s.cancelled,s.timed_out].join(" / ")],["有能力记录的任务",s.tasks_with_spans],
      ["模型准入次数",s.dispatches],["含用量的结算记录",s.usage_receipts],["待结算调用",s.pending_receipts],
      ["已结算费用",money(s.settled_micros)],["预留费用",money(s.reserved_micros)],
      ["已知输入 Token",s.input_tokens],["已知输出 Token",s.output_tokens]
    ]) {
      const block = el("div", "");
      block.append(el("dt", name), el("dd", value));
      if (name === "待结算调用" && Number(value) > 0) block.className = "warning";
      metrics.append(block);
    }
    const capabilities = byId("capabilities");
    capabilities.replaceChildren();
    byId("release").textContent = "发布版本 " + data.active_release.version_id;
    const registered = byId("registered");
    registered.replaceChildren();
    for (const c of data.active_release.capabilities) {
      const row = el("tr", "");
      cell(row, c.kind); cell(row, c.name); cell(row, c.version); cell(row, c.digest, "details");
      registered.append(row);
    }
    if (!registered.rows.length) empty(registered, 4, "当前版本未配置 Skill 或 Tool。");
    byId("cap-status").textContent = data.capabilities_truncated
      ? "按窗口内调用量显示前 " + data.capabilities.length + " 组。" : "";
    for (const c of data.capabilities) {
      const row = el("tr", "");
      cell(row, c.kind);
      const identity = cell(row, c.name, "details");
      identity.append(el("small", c.version), el("small", c.digest));
      cell(row, c.calls); cell(row, c.succeeded); cell(row, c.failed, c.failed > 0 ? "warning" : "");
      cell(row, c.unfinished); cell(row, ms(c.avg_duration_ms)); cell(row, ms(c.p95_duration_ms)); cell(row, ms(c.max_duration_ms));
      capabilities.append(row);
    }
    if (!data.capabilities.length) empty(capabilities, 9, "该范围内暂无能力执行记录。");
    byId("task-count").textContent = "显示 " + data.recent_tasks.length + " 项，选择任务 ID 查看事件。";
    const tasks = byId("tasks");
    tasks.replaceChildren();
    for (const t of data.recent_tasks) {
      const row = el("tr", "");
      row.dataset.task = t.task_id;
      row.classList.toggle("selected", selected === t.task_id);
      cell(row, date(t.created_at));
      const button = el("button", t.task_id);
      button.type = "button"; button.className = "task-link";
      button.addEventListener("click", () => showTask(t.task_id, true));
      cell(row, "").append(button);
      cell(row, stateNames[t.state] || t.state); cell(row, accounting[t.accounting_state] || t.accounting_state);
      cell(row, t.error_code, t.error_code ? "warning" : "");
      tasks.append(row);
    }
    if (!data.recent_tasks.length) empty(tasks, 5, "该时间范围内没有可见任务。");
    byId("report").hidden = false;
  }
  async function refresh() {
    if (!connection) return;
    if (view === "runs") return loadExplorer("agents");
    clearTimeout(timer);
    projectRead?.abort();
    const request = projectRead = new AbortController();
    byId("status").textContent = "正在读取项目…";
    try {
      const data = await read("/v1/projects/" + encodeURIComponent(connection.project) +
        "/monitoring?hours=" + encodeURIComponent(byId("hours").value), request.signal);
      if (request.signal.aborted) return;
      renderSummary(data);
      byId("status").textContent = "更新于 " + date(Date.now());
      if (selected) await showTask(selected, false);
    } catch (error) {
      if (request.signal.aborted) return;
      clearProject();
      if (error.status === 401 || error.status === 403) disconnect();
      byId("status").textContent = error.status ? error.message : "无法读取监控数据，请检查连接后重试。";
    } finally {
      if (projectRead === request) { projectRead = null; schedule(); }
    }
  }
  function query(page) {
    const params = new URLSearchParams({hours:byId("hours").value, limit:"25"});
    if (page.cursor) params.set("cursor", page.cursor);
    return "?" + params;
  }
  function setPaging(prefix, page, next) {
    page.next = next || null;
    byId(prefix + "-prev").disabled = !page.previous.length;
    byId(prefix + "-next").disabled = !page.next;
  }
  function changePage(which, forward) {
    const pages = {agents:agentPage, runs:runPage, trace:tracePage};
    const page = pages[which];
    if (forward) {
      if (!page.next) return;
      page.previous.push(page.cursor); page.cursor = page.next;
    } else {
      if (!page.previous.length) return;
      page.cursor = page.previous.pop();
    }
    page.next = null;
    if (which === "trace") {
      clearTrace();
      loadExplorer("trace", true);
      return;
    }
    if (which === "agents") {
      agent = ""; runPage = pageState();
      byId("agent-version").disabled = true;
      byId("agent-version").replaceChildren();
    }
    instance = null;
    byId("run-id").value = "";
    clearRuns();
    loadExplorer(which);
  }
  function renderAgents(data) {
    const chooser = byId("agent-version");
    chooser.replaceChildren(new Option("选择发布版本", ""));
    for (const a of data.agents) {
      const label = [a.profile, a.agent_version_id, a.run_count + " 次运行"].filter(Boolean).join(" · ");
      chooser.add(new Option(label, a.agent_version_id));
    }
    if (agent && !data.agents.some(a => a.agent_version_id === agent)) {
      // The selected release can move off a refreshed page. Its runs are reauthorized below.
      chooser.add(new Option(agent + "（已选版本）", agent));
    }
    chooser.value = agent;
    chooser.disabled = chooser.options.length <= 1;
    byId("agent-scope").textContent = "项目 " + data.project_id + " · " +
      (data.scope === "project" ? "全项目可见运行" : "当前主体可见运行") + " · 运行开始时间 " +
      date(data.window_start) + " 至 " + date(data.window_end);
    byId("agent-note").textContent = data.agents.length ? "" : "这个时间范围内没有可见运行。";
    setPaging("agents", agentPage, data.next_cursor);
  }
  function renderRuns(data) {
    byId("run-list").hidden = false;
    byId("runs-release").textContent = "发布版本 " + data.agent_version_id;
    const table = byId("instances");
    table.replaceChildren();
    for (const r of data.runs) {
      const row = el("tr", "");
      row.dataset.run = r.run_id;
      row.classList.toggle("selected", instance?.run_id === r.run_id);
      cell(row, date(r.started_at)); cell(row, r.task_id);
      const attempt = r.run_id.slice(r.task_id.length + 1);
      const button = el("button", "第 " + attempt + " 次");
      button.type = "button"; button.className = "run-button";
      button.setAttribute("aria-label", "查看任务 " + r.task_id + " 第 " + attempt + " 次运行");
      button.addEventListener("click", () => {
        byId("run-id").value = r.run_id;
        chooseRun({task_id:r.task_id, run_id:r.run_id, attempt});
        loadExplorer("trace", true);
      });
      cell(row, "").append(button);
      cell(row, stateNames[r.state] || r.state);
      cell(row, r.worker_id, "details");
      table.append(row);
    }
    if (!table.rows.length) empty(table, 5, "此页没有可见运行实例。");
    setPaging("instances", runPage, data.next_cursor);
  }
  function renderTrace(data, focus) {
    byId("run-detail").hidden = false;
    if (focus) byId("trace-heading").focus();
    byId("trace-id").replaceChildren(el("code", data.run_id),
      document.createTextNode(" · " + [data.profile, "发布版本 " + data.agent_version_id].filter(Boolean).join(" · ")));
    const facts = byId("run-facts"), bill = data.accounting;
    facts.replaceChildren();
    for (const [label,value] of [
      ["运行状态",stateNames[data.state] || data.state], ["Worker",data.worker_id],
      ["开始时间",eventTime(data.started_at)], ["结束时间",eventTime(data.ended_at)],
      ["观测运行耗时",ms(elapsedMs(data.started_at, data.ended_at))],
      ["结算状态",accounting[bill.state] || bill.state], ["已结算",money(bill.settled_micros)],
      ["已预留",money(bill.reserved_micros)], ["已知输入 / 输出 Token",
        (bill.input_tokens ?? "—") + " / " + (bill.output_tokens ?? "—")]
    ]) {
      const block = el("div", ""); block.append(el("dt", label), el("dd", value)); facts.append(block);
    }
    const note = "第 " + (tracePage.previous.length + 1) + " 页 · " + data.events.length + " 个事件（本地时间）";
    byId("trace-note").textContent = [note, data.error_code,
      data.has_capability_spans ? "" : "本次运行没有可用的能力观测记录"].filter(Boolean).join(" · ");
    renderEvents(byId("trace"), data.events);
    setPaging("events", tracePage, data.next_before);
  }
  async function loadExplorer(level, focus = false, missingRun = null) {
    if (!connection || view !== "runs") return;
    clearTimeout(timer);
    projectRead?.abort();
    const request = projectRead = new AbortController();
    const root = "/v1/projects/" + encodeURIComponent(connection.project) + "/agents";
    let stage = level;
    byId("explorer").hidden = false;
    byId("status").textContent = "正在读取运行记录…";
    try {
      if (level === "agents") {
        const data = await read(root + query(agentPage), request.signal);
        if (request.signal.aborted) return;
        if (data.project_id !== connection.project) throw new Error("project");
        if (missingRun && data.agents.some(a => a.agent_version_id === missingRun.version)) agent = missingRun.version;
        renderAgents(data);
      }
      if (agent && level !== "trace") {
        stage = "runs";
        const data = await read(root + "/" + encodeURIComponent(agent) + "/runs" + query(runPage), request.signal);
        if (request.signal.aborted) return;
        if (data.project_id !== connection.project || data.agent_version_id !== agent) throw new Error("release");
        renderRuns(data);
      }
      if (instance) {
        stage = "trace";
        const before = tracePage.cursor ? "?" + new URLSearchParams({before:tracePage.cursor}) : "";
        const data = await read("/v1/tasks/" + encodeURIComponent(instance.task_id) +
          "/runs/" + encodeURIComponent(instance.attempt) + "/trace" + before, request.signal);
        if (request.signal.aborted) return;
        if (data.project_id !== connection.project) {
          chooseRun(null);
          byId("status").textContent = "这次运行不属于当前项目。";
          return;
        }
        if (agent && data.agent_version_id !== agent) {
          chooseRun(null);
          byId("status").textContent = "这次运行与所选发布版本不一致。请更改或清除版本选择。";
          return;
        }
        if (data.run_id !== instance.run_id || data.task_id !== instance.task_id) throw new Error("instance");
        renderTrace(data, focus);
      }
      byId("status").textContent = missingRun ? "这次运行不存在或在当前权限下不可见。" : "更新于 " + date(Date.now());
    } catch (error) {
      if (request.signal.aborted) return;
      if (stage === "trace" && error.status === 404) {
        // A trace hides revoked access behind 404. Rebuild visible lists only after a fresh project check.
        const version = agent, typedId = byId("run-id").value;
        clearProject();
        byId("run-id").value = typedId;
        return loadExplorer("agents", false, {version});
      }
      if (error.status === 401 || error.status === 403) disconnect();
      else if (stage === "trace") chooseRun(null);
      else if (stage === "runs") { instance = null; clearRuns(); }
      else { resetExplorer(); byId("explorer").hidden = false; }
      byId("status").textContent = error.status ? error.message : "无法读取运行轨迹，请检查连接后刷新。";
    } finally {
      if (projectRead === request) { projectRead = null; schedule(); }
    }
  }
  async function showTask(id, focus) {
    taskRead?.abort();
    const request = taskRead = new AbortController();
    selected = id;
    for (const row of byId("tasks").rows) row.classList.toggle("selected", row.dataset.task === id);
    byId("detail").hidden = false;
    if (focus) byId("detail-heading").focus();
    byId("detail-meta").textContent = id;
    byId("detail-status").textContent = "正在读取事件…";
    const table = byId("timeline");
    table.replaceChildren();
    try {
      const data = await read("/v1/tasks/" + encodeURIComponent(id) + "/timeline", request.signal);
      if (request.signal.aborted) return;
      byId("detail-meta").textContent = id + " · " + (stateNames[data.state] || data.state) +
        " · 发布版本 " + data.agent_version_id + (data.error_code ? " · " + data.error_code : "");
      byId("detail-status").textContent = (data.truncated ? "仅显示最近 " : "显示 ") +
        data.events.length + " 个事件（本地时间）";
      renderEvents(table, data.events);
    } catch (error) {
      if (request.signal.aborted) return;
      if (error.status === 401 || error.status === 403) {
        disconnect(); byId("status").textContent = error.message;
      } else {
        byId("detail-status").textContent = error.status ? error.message : "时间线读取失败。";
      }
    }
  }
  function renderEvents(table, events) {
    table.replaceChildren();
    for (const e of events) {
      const row = el("tr", "");
      if (e.error_code || e.event === "failed") row.className = "failed";
      cell(row, eventTime(e.occurred_at)); cell(row, kinds[e.kind] || e.kind);
      cell(row, eventNames[e.event] || e.event); cell(row, e.attempt);
      const details = cell(row, [e.model || e.name,e.version].filter(Boolean).join(" "), "details");
      for (const [key,label] of [["digest","版本摘要"],["span_id","调用"],["parent_span_id","父调用"],
                                  ["dispatch_attempt_id","模型尝试"],["snapshot_id","快照"],["receipt_ref","回执摘要"]]) {
        if (e[key]) details.append(el("small", label + " " + e[key]));
      }
      if (e.reservation_micros != null) details.append(el("small", "预留 " + money(e.reservation_micros)));
      if (e.actual_micros != null) details.append(el("small", "结算 " + money(e.actual_micros)));
      if (e.input_tokens != null || e.output_tokens != null) {
        details.append(el("small", "输入 / 输出 Token " + (e.input_tokens ?? "—") + " / " + (e.output_tokens ?? "—")));
      }
      cell(row, ms(e.duration_ms)); cell(row, e.error_code, e.error_code ? "warning" : "");
      table.append(row);
    }
    if (!events.length) empty(table, 7, "尚无可见事件。");
  }
  function switchView(next) {
    if (view === next) return;
    projectRead?.abort(); taskRead?.abort();
    view = next;
    setViewButtons();
    byId("report").hidden = true;
    resetExplorer();
    clearDetail();
    refresh();
  }
  byId("overview-view").addEventListener("click", () => switchView("overview"));
  byId("runs-view").addEventListener("click", () => switchView("runs"));
  byId("agent-version").addEventListener("change", event => {
    agent = event.target.value; instance = null; runPage = pageState();
    byId("run-id").value = "";
    clearRuns(); loadExplorer("runs");
  });
  byId("find-run").addEventListener("submit", event => {
    event.preventDefault();
    const runId = byId("run-id").value.trim();
    const parts = /^([^\s:/\\?#]+):([1-9]\d{0,19})$/.exec(runId);
    if (!parts || parts[1] === "." || parts[1] === ".." || BigInt(parts[2]) > 18446744073709551615n) {
      projectRead?.abort(); chooseRun(null); schedule();
      byId("status").textContent = "请输入有效的运行 ID，格式为 任务 ID:尝试次数。";
      return;
    }
    chooseRun({run_id:runId, task_id:parts[1], attempt:parts[2]});
    loadExplorer("trace", true);
  });
  for (const [prefix,level] of [["agents","agents"],["instances","runs"],["events","trace"]]) {
    byId(prefix + "-prev").addEventListener("click", () => changePage(level, false));
    byId(prefix + "-next").addEventListener("click", () => changePage(level, true));
  }
  byId("connect").addEventListener("submit", event => {
    event.preventDefault();
    const project = byId("project").value.trim(), token = byId("token").value.trim();
    if (!project || !token || project === "." || project === "..") {
      byId("status").textContent = "请填写有效的项目 ID 和访问令牌。";
      return;
    }
    disconnect();
    connection = {project,token};
    byId("connect").hidden = true;
    byId("actions").hidden = false;
    byId("views").hidden = false;
    refresh();
  });
  byId("disconnect").addEventListener("click", disconnect);
  byId("refresh").addEventListener("click", refresh);
  byId("automatic").addEventListener("change", schedule);
  byId("hours").addEventListener("change", () => { clearDetail(); resetExplorer(); refresh(); });
  document.addEventListener("visibilitychange", schedule);
  window.addEventListener("pagehide", disconnect);
})();
</script>
</body>
</html>
