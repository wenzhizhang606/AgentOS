[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agentos"
version = "0.1.0"
description = "Context-managed enterprise agent runtime"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.112,<1",
    "pydantic>=2.6,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.29,<1",
    "PyMySQL[rsa]>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<0.29"]

[project.scripts]
agentos = "agentos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentos.observability" = [
    "dashboard.html", "console.css", "components.js", "console.js", "walkthrough.js",
    "architecture.webp", "agent-components.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mysql: uses an explicitly configured MySQL test database"]
